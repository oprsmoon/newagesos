pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p .public_build
    - cp -r *.html *.js *.css *.json assets .public_build/ 2>/dev/null || true
    - rm -rf public
    - mv .public_build public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

